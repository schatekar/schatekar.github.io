# Publishes posts dated in the future once their time comes.
# Jekyll leaves out posts whose date hasn't arrived yet, and GitHub Pages only
# rebuilds on a push, so this asks for a rebuild every hour.
name: Scheduled publish

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq .status
